name: Zampto 自动续期

on:
  # schedule:
    # - cron: '0 0 * * *'  # 每天 UTC 00:00 (北京时间 08:00)
  workflow_dispatch:
    inputs:
      force_renew:
        description: 'Force renewal regardless of expiry'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      enable_recording:
        description: 'Enable screen recording'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  zampto-auto:
    name: 检查并自动续期
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISPLAY: ":99"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"

    steps:
      - uses: actions/checkout@v4

      - name: 🐍 配置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 安装系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb ffmpeg curl unzip \
            fonts-noto-cjk \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: 📦 安装 Python 依赖
        run: |
          pip install -r requirements.txt
          python -c "from cloakbrowser import ensure_binary; ensure_binary()"

      - name: "🌐 设置代理 (sing-box, 复用 ACLClouds 的 setup_proxy.sh)"
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
      - name: 🔄 运行续期脚本
        env:
          ZAMPTO_USERNAME: ${{ secrets.ZAMPTO_USERNAME }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          ZAMPTO_SERVER_ID: ${{ secrets.ZAMPTO_SERVER_ID }}
          ZAMPTO_SESSION_SECRET: ${{ secrets.ZAMPTO_SESSION_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_RENEW: ${{ github.event.inputs.force_renew || 'false' }}
          ENABLE_RECORDING: ${{ github.event.inputs.enable_recording || 'false' }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: |
          # 对接 setup_proxy.sh 导出的代理 (PROXY_SERVER -> zampto 脚本读取的 ALL_PROXY 系列)
          if [ -n "$PROXY_SERVER" ]; then
            echo "ALL_PROXY=$PROXY_SERVER" >> $GITHUB_ENV
            echo "HTTP_PROXY=$PROXY_SERVER" >> $GITHUB_ENV
            echo "HTTPS_PROXY=$PROXY_SERVER" >> $GITHUB_ENV
            echo "[OK] 已对接代理: $PROXY_SERVER"
          fi

          Xvfb :99 -screen 0 1280x720x24 +extension RANDR &
          XVFB_PID=$!
          sleep 2

          RECORD_PID=""
          if [ "$ENABLE_RECORDING" = "true" ]; then
            echo "Recording enabled"
            ffmpeg -f x11grab -video_size 1280x720 -framerate 10 -i :99 \
              -codec:v libx264 -preset ultrafast -crf 30 \
              -pix_fmt yuv420p -movflags +faststart /tmp/recording.mp4 \
              > /tmp/ffmpeg.log 2>&1 &
            RECORD_PID=$!
            sleep 2
          fi

          python zampto_auto.py
          PYTHON_EXIT=$?

          sleep 2
          [ -n "$RECORD_PID" ] && kill $RECORD_PID 2>/dev/null
          [ -n "$RECORD_PID" ] && wait $RECORD_PID 2>/dev/null
          kill $XVFB_PID 2>/dev/null

          # CRITICAL: Clear proxy env vars so subsequent Node.js steps (upload-artifact,
          # checkout cleanup) don't try to use SOCKS5 which they don't support
          echo "ALL_PROXY=" >> $GITHUB_ENV
          echo "HTTP_PROXY=" >> $GITHUB_ENV
          echo "HTTPS_PROXY=" >> $GITHUB_ENV

          exit $PYTHON_EXIT

      - name: 📸 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        env:
          # 显式清空代理环境变量给 upload-artifact@v4 用 (Node undici 解析代理 URL,
          # socks5h:// 它不支持会抛 "Invalid URL protocol" 错误).
          # 注意: GitHub Actions env key 不区分大小写 (case-insensitive),
          # 不能同时写 ALL_PROXY 和 all_proxy 否则会被拒 "X is already defined".
          # 这里只保留大写形式 + NO_PROXY, 全部置空让 Node 不使用任何代理.
          ALL_PROXY: ''
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
          NO_PROXY: '*'
        with:
          name: debug-${{ github.run_number }}
          path: |
            ./screenshots/*.png
            ${{ github.event.inputs.enable_recording == 'true' && '/tmp/recording.mp4' || '' }}
          if-no-files-found: ignore
          retention-days: 3
